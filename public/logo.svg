<svg width="200" height="200" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Royal Gold Gradient -->
    <linearGradient id="royalGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#b8860b" />
    </linearGradient>
    
    <!-- Royal Sapphire Gradient -->
    <linearGradient id="royalSapphireGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af" />
      <stop offset="50%" stop-color="#0f2b5c" />
      <stop offset="100%" stop-color="#091e42" />
    </linearGradient>

    <!-- Emerald Glow Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="royalGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#d4af37" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- 1. Shield Boundary (Governance & Safety Sentinel) -->
  <path d="M50 8 L82 22 V50 C82 70 50 90 50 90 C50 90 18 70 18 50 V22 L50 8 Z" 
        fill="url(#royalSapphireGrad)" stroke="url(#royalGoldGrad)" stroke-width="3" filter="url(#royalGlow)"/>

  <!-- 2. DataHub Lineage Orbit Rings (Lineage & Metadata Graph) -->
  <circle cx="50" cy="46" r="26" stroke="url(#royalGoldGrad)" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.65" />
  <circle cx="50" cy="46" r="34" stroke="url(#royalGoldGrad)" stroke-width="1" opacity="0.35" />

  <!-- 3. Kinematic Human Figure (Pose & Motion Engine) -->
  <circle cx="50" cy="28" r="5" fill="url(#royalGoldGrad)" stroke="#ffffff" stroke-width="1" />
  <path d="M50 33 V58" stroke="url(#royalGoldGrad)" stroke-width="2.5" stroke-linecap="round" />
  <path d="M32 38 L50 42 L68 38" stroke="url(#royalGoldGrad)" stroke-width="2.5" stroke-linecap="round" />
  <path d="M36 68 L50 58 L64 68" stroke="url(#royalGoldGrad)" stroke-width="2.5" stroke-linecap="round" />

  <circle cx="32" cy="38" r="2.5" fill="#ffffff" stroke="url(#royalGoldGrad)" stroke-width="1" />
  <circle cx="68" cy="38" r="2.5" fill="#ffffff" stroke="url(#royalGoldGrad)" stroke-width="1" />
  <circle cx="36" cy="68" r="2.5" fill="#ffffff" stroke="url(#royalGoldGrad)" stroke-width="1" />
  <circle cx="64" cy="68" r="2.5" fill="#ffffff" stroke="url(#royalGoldGrad)" stroke-width="1" />

  <!-- 4. Privacy Core Eye (Edge Privacy Boundary) -->
  <circle cx="50" cy="46" r="6" fill="#0f2b5c" stroke="url(#royalGoldGrad)" stroke-width="1.5" />
  <circle cx="50" cy="46" r="2.5" fill="url(#emeraldGrad)" />

  <!-- 5. Metadata Tri-Nodes (Graph Context) -->
  <circle cx="50" cy="14" r="2" fill="url(#royalGoldGrad)" />
  <circle cx="78" cy="62" r="2" fill="url(#royalGoldGrad)" />
  <circle cx="22" cy="62" r="2" fill="url(#royalGoldGrad)" />
</svg>
